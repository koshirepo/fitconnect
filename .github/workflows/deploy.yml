# Branch-based deployment to Cloudflare.
#
#   branch main -> production (Worker: fitconnect-api + Pages: fitconnect-pwa)
#
# Production is the only deployed environment; everything else runs locally.
# Pushing any other branch only builds and type-checks; nothing is deployed.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  - Cloudflare API token with edit on Workers, D1, R2,
#                          and Pages. Scoped to the account that owns this repo's
#                          resources. See docs/DEPLOYMENT.md for scope tips.
#
# One-time manual setup (cannot be done from CI):
#   - Create the D1 database and R2 bucket; fill their ids into wrangler.toml.
#   - Set the API Worker secrets (npm run secrets:production).
#   - Create the Pages project fitconnect-pwa.
#   See docs/DEPLOYMENT.md.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Run checks on every push for fast feedback, independent of deployment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      ############################################################
      # API Worker
      ############################################################
      - name: Deploy API
        run: npm run deploy:production --workspace @fitconnect/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      ############################################################
      # PWA / Cloudflare Pages
      ############################################################
      # deploy:production = npm run build:production && wrangler pages deploy dist --project-name=fitconnect-pwa --branch=main
      - name: Deploy PWA
        run: npm run deploy:production --workspace @fitconnect/pwa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}