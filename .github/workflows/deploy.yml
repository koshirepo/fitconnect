# Branch-based deployment to Cloudflare.
#
#   branch main  -> production (Worker: fitconnect-api + Pages: fitconnect-pwa)
#   branch test  -> test        (Worker: fitconnect-api-test + Pages: fitconnect-pwa-test)
#
# The target environment is derived from the branch being pushed. Pushing to any
# other branch only builds and type-checks; nothing is deployed.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  - Cloudflare API token with edit on Workers, D1, R2,
#                          and Pages. Scoped to the account that owns this repo's
#                          resources. See docs/DEPLOYMENT.md for scope tips.
#
# One-time manual setup (cannot be done from CI):
#   - Create the test D1 database and R2 bucket; fill their ids into wrangler.toml.
#   - Set the API Worker secrets for both environments (npm run secrets:test etc.).
#   - Create the Pages projects fitconnect-pwa and fitconnect-pwa-test.
#   See docs/DEPLOYMENT.md.

name: Deploy

on:
  push:
    branches: [main, test]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Run checks on every push for fast feedback, independent of deployment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'test' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "name=production" >> "${GITHUB_OUTPUT}"
          else
            echo "name=test" >> "${GITHUB_OUTPUT}"
          fi

      ############################################################
      # API Worker
      ############################################################
      - name: Deploy API (${{ steps.env.outputs.name }})
        run: npm run deploy:production --workspace @fitconnect/api
        if: steps.env.outputs.name == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy API (test)
        run: npm run deploy:test --workspace @fitconnect/api
        if: steps.env.outputs.name != 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      ############################################################
      # PWA / Cloudflare Pages
      ############################################################
      # deploy:production = npm run build:production && wrangler pages deploy dist --project-name=fitconnect-pwa --branch=main
      # deploy:test       = npm run build:test       && wrangler pages deploy dist --project-name=fitconnect-pwa-test --branch=test
      - name: Deploy PWA (${{ steps.env.outputs.name }})
        run: npm run deploy:production --workspace @fitconnect/pwa
        if: steps.env.outputs.name == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy PWA (test)
        run: npm run deploy:test --workspace @fitconnect/pwa
        if: steps.env.outputs.name != 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}