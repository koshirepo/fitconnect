# Branch-based deployment to Cloudflare.
#
#   branch main -> production (Worker: fitconnect-api + Pages: fitconnect-pwa)
#
# Production is the only deployed environment; everything else runs locally.
#
# Checks run on every pull request and on main. Only main deploys. The checks
# used to be wired to `push: [main]` alone, which meant they first ran on the
# merge commit, as step one of the deploy that was already shipping the code —
# a branch that failed type-check was found out while it was going live, and a
# branch with no PR was never checked at all.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  - Cloudflare API token with edit on Workers, D1, R2,
#                          and Pages. Scoped to the account that owns this repo's
#                          resources. See docs/DEPLOYMENT.md for scope tips.
#
# One-time manual setup (cannot be done from CI):
#   - Create the D1 database and R2 bucket; fill their ids into wrangler.toml.
#   - Set the API Worker secrets (pnpm run secrets:production).
#   - Create the Pages project fitconnect-pwa.
#   See docs/DEPLOYMENT.md.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # Superseding a pull request's checks is free. Superseding a run on main is
  # not: that run may be partway through applying a migration to the production
  # database, and killing it there leaves the schema half-changed.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # Run checks on every push for fast feedback, independent of deployment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Corepack reads packageManager from the root package.json, so the pnpm
      # version CI uses is the one pinned in the repo, not whatever is newest.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Corepack reads packageManager from the root package.json, so the pnpm
      # version CI uses is the one pinned in the repo, not whatever is newest.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      ############################################################
      # Database
      ############################################################
      # A restore point, taken before anything touches the schema.
      #
      # These migrations are one-way. `wrangler d1 migrations apply` has no down
      # step, and SQLite changes a column or a foreign key by rebuilding the
      # table — the original is dropped as part of the migration. A rebuild that
      # loses rows still reports every statement as successful, so this is not a
      # failure the deploy can notice and stop for. Migration 0042 dropped 32
      # rows locally that way, and only a row count taken by hand caught it.
      #
      # Failing here is deliberate: no restore point, no migration.
      #
      # The dump goes to its own private bucket rather than a workflow artifact.
      # It is every member row — names, emails, phone numbers, and the sealed
      # bank account numbers behind payouts — and it belongs inside the same
      # account boundary as the database it came from, not in storage every
      # repo collaborator can download. It must never go in `fit-bucket`
      # either: that one is served to the public at R2_PUBLIC_URL, which would
      # publish the whole database at a fetchable URL.
      #
      # Backups accumulate at a few MB per deploy. Add a lifecycle rule on the
      # bucket if that ever starts to matter.
      - name: Back up production D1
        working-directory: apps/api
        run: |
          set -euo pipefail
          key="fit-db-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}.sql"

          # Tolerates "already exists", which is every deploy after the first.
          # Here rather than in the manual setup list so the first run of this
          # workflow does not fail on a bucket nobody knew to create.
          pnpm exec wrangler r2 bucket create "$BACKUP_BUCKET" || true

          pnpm exec wrangler d1 export fit-db \
            --env production --remote --skip-confirmation --output "$key"

          echo "Exported $(wc -c < "$key") bytes"

          pnpm exec wrangler r2 object put "$BACKUP_BUCKET/$key" \
            --file "$key" --content-type application/sql --remote

          echo "::notice::Production D1 backed up to $BACKUP_BUCKET/$key"
        env:
          BACKUP_BUCKET: fit-db-backups
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Runs before the Worker so new code never meets an old schema. Applying
      # migrations is idempotent: wrangler tracks which files a database has
      # already seen and applies only the rest, so a deploy with no new
      # migration is a no-op.
      - name: Apply D1 migrations
        run: pnpm --filter @fitconnect/api db:migrate:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      ############################################################
      # API Worker
      ############################################################
      - name: Deploy API
        run: pnpm --filter @fitconnect/api deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      ############################################################
      # PWA / Cloudflare Pages
      ############################################################
      # deploy:production = pnpm run build:production && wrangler pages deploy dist --project-name=fitconnect-pwa --branch=main
      - name: Deploy PWA
        run: pnpm --filter @fitconnect/pwa deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
