# Documentation: Cloudflare Worker deployment configuration.
# - Declares the Worker entrypoint, compatibility settings, and the D1/R2 bindings consumed by the runtime code.
# - Binding names in this file must remain aligned with `src/index.ts`, `src/lib/prisma.ts`, and the upload routes before local or remote deploys will work.
#
# Environments
# ------------
#   (top level)   local development — `npm run dev`, backed by the local miniflare D1/R2 state
#   env.test      shared test deployment — `npm run deploy:test`
#   env.production live deployment      — `npm run deploy:production`
#
# Wrangler does NOT inherit `vars`, `d1_databases`, `r2_buckets`, or `triggers`
# into named environments, so each block below repeats everything it needs.
#
# Secrets are NOT stored here. Set them per environment with:
#   npx wrangler secret put JWT_SECRET --env test
#   npx wrangler secret put EMAIL_USER --env test
#   npx wrangler secret put EMAIL_PASSWORD --env test
#   npx wrangler secret put VAPID_PRIVATE_KEY --env test
#   npx wrangler secret put RAZORPAY_KEY_ID --env test
#   npx wrangler secret put RAZORPAY_KEY_SECRET --env test
#   npx wrangler secret put RAZORPAY_WEBHOOK_SECRET --env test
#   npx wrangler secret put CREDENTIALS_KEY --env test
# and again with `--env production`. For local development put the same keys in
# `.dev.vars` (gitignored) — see `.dev.vars.example`.

name = "fitconnect-api-dev"
main = "src/index.ts"
compatibility_date = "2026-03-27"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["30 3 * * *"] # Daily at 03:30 UTC / 09:00 IST for tenant reports

[[d1_databases]]
binding = "DB"
database_name = "fit-db"
database_id = "9578b082-95e3-4284-bec8-10f3a075309b"
migrations_dir = "prisma/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "fit-bucket"

[vars]
APP_URL = "http://localhost:5173"
APP_ROOT_DOMAINS = "localhost"
R2_PUBLIC_URL = "https://pub-2da141b1571a44ebb3e8f7633b6e5b61.r2.dev"
CORS_ORIGIN = "http://localhost:5173"
EMAIL_HOST = "smtp.gmail.com"
EMAIL_PORT = "587"
EMAIL_SECURE = "false"
EMAIL_FROM = "Fit Connect <rudragymbakhri@gmail.com>"
VAPID_EMAIL = "mailto:rudragymbakhri@gmail.com"
VAPID_PUBLIC_KEY = "BGM8SxeUeDufKP-etZ5Q-GJpW9GTmBhay_fGHK2vBlsIWVfbsbHzPD_TLVbSl35oBOnjL2qdG47YibTHhwASP2c"

