# Documentation: Cloudflare Worker deployment configuration.
# - Declares the Worker entrypoint, compatibility settings, and the D1/R2 bindings consumed by the runtime code.
# - Binding names in this file must remain aligned with `src/index.ts`, `src/lib/prisma.ts`, and the upload routes before local or remote deploys will work.
#
# Environments
# ------------
#   (top level)    local development — `npm run dev`, backed by the local miniflare D1/R2 state
#   env.production live deployment    — `npm run deploy:production`
#
# Wrangler does NOT inherit `vars`, `d1_databases`, `r2_buckets`, or `triggers`
# into named environments, so the production block below repeats everything it needs.
#
# Secrets are NOT stored here. Set them all with `npm run secrets:production`, or
# one at a time:
#   npx wrangler secret put JWT_SECRET --env production
# For local development put the same keys in `.dev.vars` (gitignored) — see
# `.dev.vars.example`.

name = "fitconnect-api-dev"
main = "src/index.ts"
compatibility_date = "2026-03-27"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["30 3 * * *", "30 4 * * *"] # 03:30 UTC tenant reports, 04:30 UTC renewal reminders

[[d1_databases]]
binding = "DB"
database_name = "fit-db"
database_id = "5aefb73c-0f37-4c33-9ba3-78b38ea1c4c4"
migrations_dir = "prisma/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "fit-bucket"

# Caps unauthenticated signup attempts per IP. `namespace_id` is an arbitrary
# positive integer that scopes the counter; the limit is per Worker, not global.
[[ratelimits]]
name = "SIGNUP_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 5
period = 60

[vars]
APP_URL = "http://localhost:5173"
APP_ROOT_DOMAINS = "localhost"
CLOUDFLARE_ACCOUNT_ID = "610fe4c99988bf13d33f49fbfe446fee"
CLOUDFLARE_PAGES_PROJECT = "fitconnect-pwa"
# The bucket that actually serves the stored files. The previous value
# (pub-2da141...) returns 404 for objects that exist under this one, which
# broke local development: the API proxy falls back to this address when its
# own bucket lacks the object, and every avatar and logo rendered as initials.
R2_PUBLIC_URL = "https://pub-f9794d5233bf467ca886bdf6c65a7cbe.r2.dev"
CORS_ORIGIN = "http://localhost:5173"
EMAIL_HOST = "smtp.gmail.com"
EMAIL_PORT = "587"
EMAIL_SECURE = "false"
EMAIL_FROM = "Fit Connect <rudragymbakhri@gmail.com>"
VAPID_EMAIL = "mailto:rudragymbakhri@gmail.com"
VAPID_PUBLIC_KEY = "BGM8SxeUeDufKP-etZ5Q-GJpW9GTmBhay_fGHK2vBlsIWVfbsbHzPD_TLVbSl35oBOnjL2qdG47YibTHhwASP2c"

# ─── Production ───────────────────────────────────────────────────────────────

[env.production]
name = "fitconnect-api"

[env.production.triggers]
crons = ["30 3 * * *", "30 4 * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "fit-db"
database_id = "5aefb73c-0f37-4c33-9ba3-78b38ea1c4c4"
migrations_dir = "prisma/migrations"

[[env.production.r2_buckets]]
