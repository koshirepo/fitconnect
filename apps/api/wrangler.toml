name = "hono-prisma-d1-r2-api"
main = "src/index.ts"
compatibility_date = "2026-03-27"
compatibility_flags = ["nodejs_compat"]

# Replace these placeholder values after creating your Cloudflare resources:
#   npx wrangler d1 create api-db
#   npx wrangler r2 bucket create api-files
[[d1_databases]]
binding = "DB"
database_name = "fit-db"
database_id = "d9d38b6c-1ff4-4e4f-8491-5ce06a21e8ad"
preview_database_id = "d9d38b6c-1ff4-4e4f-8491-5ce06a21e8ad"
migrations_dir = "prisma/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "fit-bucket"
preview_bucket_name = "api-files"

