<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1b2a" />

    <!-- Primary SEO Meta Tags -->
    <title>FitConnect — Gym Management Software | Gym Accessories &amp; Equipment Shop</title>
    <meta name="title" content="FitConnect — Gym Management Software | Gym Accessories & Equipment Shop" />
    <meta name="description" content="FitConnect is an all-in-one gym management software for fitness centers, health clubs & gyms. Manage members, payments, attendance, subscriptions & sell gym accessories like performance apparel, hydration bottles, protein shakers and more." />
    <meta name="keywords" content="gym management software, gym management system, fitness center management, health club software, gym accessories, gym equipment shop, gym apparel, protein shakers, gym water bottles, fitness accessories, member management, gym billing software, attendance tracking, workout plans, gym subscription management, fitness business software, gym POS, gym inventory, buy gym accessories online, gym merchandise" />
    <meta name="author" content="FitConnect" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://fitconnect.co.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fitconnect.co.in/" />
    <meta property="og:title" content="FitConnect — Gym Management Software | Shop Gym Accessories" />
    <meta property="og:description" content="All-in-one gym management software with member management, payments, attendance, subscriptions & an online shop for gym accessories — performance apparel, hydration bottles, protein shakers & more." />
    <meta property="og:image" content="https://fitconnect.co.in/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FitConnect — Gym Management Software and Gym Accessories Shop" />
    <meta property="og:site_name" content="FitConnect" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://fitconnect.co.in/" />
    <meta name="twitter:title" content="FitConnect — Gym Management Software | Shop Gym Accessories" />
    <meta name="twitter:description" content="Manage your gym and sell accessories with FitConnect — member management, billing, attendance, workout plans & an online shop for gym gear." />
    <meta name="twitter:image" content="https://fitconnect.co.in/icons/og-image.png" />
    <meta name="twitter:image:alt" content="FitConnect — Gym Management Software and Gym Accessories Shop" />

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "FitConnect",
        "url": "https://fitconnect.co.in/",
        "description": "All-in-one gym management software for fitness centers and health clubs. Manage members, payments, attendance, subscriptions, workout plans and sell gym accessories online.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, iOS, Android",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR",
          "availability": "https://schema.org/InStock"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "reviewCount": "150",
          "bestRating": "5",
          "worstRating": "1"
        },
        "featureList": "Member Management, Payment Tracking, Attendance, Subscription Management, Workout Plans, Gym Accessories Shop, Badge System, Push Notifications",
        "screenshot": "https://fitconnect.co.in/icons/og-image.png"
      }
    </script>

    <!-- Structured Data: Online Store -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "FitConnect Shop — Gym Accessories & Equipment",
        "url": "https://fitconnect.co.in/shop",
        "description": "Shop premium gym accessories online — performance apparel, hydration bottles, protein shakers, workout gear and more. Quality fitness equipment at affordable prices with fast delivery.",
        "image": "https://fitconnect.co.in/icons/og-image.png",
        "priceRange": "₹299 - ₹899",
        "currenciesAccepted": "INR",
        "paymentAccepted": "UPI, Credit Card, Debit Card, Net Banking",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Gym Accessories",
          "itemListElement": [
            {
              "@type": "OfferCatalog",
              "name": "Gym Apparel",
              "description": "Performance gym t-shirts, workout wear and fitness clothing"
            },
            {
              "@type": "OfferCatalog",
              "name": "Gym Accessories",
              "description": "Hydration bottles, protein shakers, gym bags and fitness accessories"
            }
          ]
        }
      }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "FitConnect",
        "url": "https://fitconnect.co.in/",
        "logo": "https://fitconnect.co.in/icons/icon-512x512.png",
        "description": "Gym management software and gym accessories shop",
        "sameAs": []
      }
    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FitConnect",
        "url": "https://fitconnect.co.in/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://fitconnect.co.in/shop?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Structured Data: BreadcrumbList -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://fitconnect.co.in/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Shop Gym Accessories",
            "item": "https://fitconnect.co.in/shop"
          },
          {
            "@type": "ListItem",
            "position": 3,
            "name": "Dashboard",
            "item": "https://fitconnect.co.in/dashboard"
          }
        ]
      }
    </script>

    <!-- Prevent flash of unstyled theme: apply persisted theme before React loads -->
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("gms-ui") || "{}");
          var theme = stored.state && stored.state.theme === "light" ? "light" : "dark";
          document.documentElement.classList.add(theme);
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- PWA meta for iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitConnect" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96x96.png" />
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif;">

        <ul style="list-style: none; padding: 0;">
          <li>Member Management & Registration</li>

        <h2>Shop Gym Accessories</h2>
        <p>Browse our collection of premium gym accessories — performance apparel, hydration bottles, protein shakers and fitness equipment.</p>
        <p>Please enable JavaScript to use FitConnect.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
