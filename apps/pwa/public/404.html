<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — FitConnect | Gym Management Software</title>
    <meta name="description" content="The page you're looking for doesn't exist. Visit FitConnect for gym management software and shop gym accessories online." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://fitconnect.co.in/" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 3rem 1rem; background: #09090b; color: #fafafa; }
      h1 { font-size: 2rem; margin-bottom: 0.5rem; }
      p { color: #a1a1aa; max-width: 480px; margin: 0.75rem auto; line-height: 1.6; }
      a { color: #3b82f6; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .links { margin-top: 2rem; display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
    </style>
    <script>
      // SPA redirect for deployment platforms
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <h1>Page Not Found</h1>
    <p>Sorry, the page you're looking for doesn't exist or has been moved.</p>
    <p>FitConnect is an all-in-one gym management software for fitness centers. Manage members, payments, attendance, and shop gym accessories online.</p>
    <div class="links">
      <a href="/">Home</a>
      <a href="/shop">Shop Gym Accessories</a>
      <a href="/login">Login</a>
    </div>
  </body>
</html>
